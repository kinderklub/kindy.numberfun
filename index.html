<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Number Fun: Seronok Nombor (Kindy Klub Edition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #00B4D8;
    }

    /* 3D Toy Diorama Sky Gradient */
    .diorama-sky {
      background: linear-gradient(180deg, #3A86FF 0%, #00B4D8 55%, #90E0EF 100%);
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Drifting Cloud Animations */
    @keyframes floatCloudSlow {
      0% { transform: translateX(-260px); }
      100% { transform: translateX(calc(100vw + 260px)); }
    }
    @keyframes floatCloudFast {
      0% { transform: translateX(-320px); }
      100% { transform: translateX(calc(100vw + 320px)); }
    }
    .cloud-slow {
      animation: floatCloudSlow 34s linear infinite;
    }
    .cloud-fast {
      animation: floatCloudFast 22s linear infinite;
    }

    /* Gentle Floating & Mascot Bounce Animations */
    @keyframes gentleBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes mascotCheer {
      0%, 100% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-28px) scale(1.12, 0.9) rotate(-6deg); }
      50% { transform: translateY(-14px) scale(0.92, 1.08) rotate(6deg); }
      75% { transform: translateY(-22px) scale(1.06, 0.95) rotate(-3deg); }
    }
    @keyframes pandaBreathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.02, 0.98) translateY(2px); }
    }
    @keyframes pandaBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }
    @keyframes pandaWaveArm {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(-52deg); }
    }
    @keyframes pandaLeftSway {
      0%, 100% { transform: rotate(15deg); }
      50% { transform: rotate(26deg); }
    }
    @keyframes earWiggle {
      0%, 88%, 100% { transform: rotate(0deg); }
      92% { transform: rotate(-8deg); }
      96% { transform: rotate(8deg); }
    }
    @keyframes targetPopPulse {
      0% { transform: scale(0.7); opacity: 0.5; }
      50% { transform: scale(1.35); }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-bob {
      animation: gentleBob 3.5s ease-in-out infinite;
    }
    .mascot-cheering {
      animation: mascotCheer 0.85s ease-in-out;
    }
    .mascot-idle-breathe {
      animation: pandaBreathe 2.8s ease-in-out infinite;
      transform-origin: bottom center;
    }
    .panda-blinking {
      animation: pandaBlink 3.6s ease-in-out infinite;
      transform-origin: center 58px;
    }
    .panda-arm-waving {
      animation: pandaWaveArm 1.6s ease-in-out infinite;
      transform-origin: 108px 94px;
    }
    .panda-arm-left {
      animation: pandaLeftSway 3s ease-in-out infinite;
      transform-origin: 32px 94px;
    }
    .panda-ears-wiggle {
      animation: earWiggle 4s ease-in-out infinite;
      transform-origin: center 32px;
    }
    .target-highlight-anim {
      animation: targetPopPulse 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes bubbleWobble {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.15, 0.88) rotate(-6deg); }
      50% { transform: scale(0.9, 1.12) rotate(6deg); }
      75% { transform: scale(1.08, 0.95) rotate(-3deg); }
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.18) rotate(12deg); }
    }

    .animate-bob {
      animation: gentleBob 3.5s ease-in-out infinite;
    }
    .mascot-cheering {
      animation: mascotCheer 0.85s ease-in-out;
    }
    .wobble-error {
      animation: bubbleWobble 0.6s ease-in-out;
    }
    .star-pop-animate {
      animation: starPulse 1s ease-in-out infinite;
    }

    /* Chunky Preschool 3D Buttons & Cards */
    .toy-card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 32px;
      border: 4px solid #FFFFFF;
      box-shadow: 0 16px 36px rgba(13, 71, 161, 0.22), inset 0 2px 4px rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
    }
    .toy-btn-orange {
      background: linear-gradient(180deg, #FFA726 0%, #F57C00 100%);
      border-bottom: 6px solid #B26A00;
      box-shadow: 0 8px 18px rgba(245, 124, 0, 0.4);
      transition: all 0.15s ease;
    }
    .toy-btn-orange:active {
      transform: translateY(4px);
      border-bottom-width: 2px;
      box-shadow: 0 3px 8px rgba(245, 124, 0, 0.4);
    }
    .toy-btn-green {
      background: linear-gradient(180deg, #66BB6A 0%, #388E3C 100%);
      border-bottom: 6px solid #1B5E20;
      box-shadow: 0 8px 18px rgba(56, 142, 60, 0.4);
      transition: all 0.15s ease;
    }
    .toy-btn-green:active {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }
    .toy-btn-blue {
      background: linear-gradient(180deg, #42A5F5 0%, #1976D2 100%);
      border-bottom: 6px solid #0D47A1;
      box-shadow: 0 8px 18px rgba(25, 118, 210, 0.35);
      transition: all 0.15s ease;
    }
    .toy-btn-blue:active {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }
    .toy-btn-yellow {
      background: linear-gradient(180deg, #FFEE58 0%, #FBC02D 100%);
      border-bottom: 6px solid #C49000;
      box-shadow: 0 8px 18px rgba(251, 192, 45, 0.4);
      color: #3E2723;
      transition: all 0.15s ease;
    }
    .toy-btn-yellow:active {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      background: rgba(10, 25, 47, 0.72);
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <div class="diorama-sky pointer-events-none z-0">
    <!-- 3D Glowing Sun (SVG) -->
    <div class="absolute top-4 left-6 md:top-8 md:left-12 w-24 h-24 md:w-32 md:h-32 opacity-95">
      <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-lg">
        <defs>
          <radialGradient id="sunGrad" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#FFF9C4" />
            <stop offset="45%" stop-color="#FFD54F" />
            <stop offset="100%" stop-color="#FFA000" />
          </radialGradient>
          <filter id="sunGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <!-- Sun Rays -->
        <g stroke="#FFE082" stroke-width="4" stroke-linecap="round" opacity="0.85">
          <line x1="50" y1="8" x2="50" y2="18" />
          <line x1="50" y1="82" x2="50" y2="92" />
          <line x1="8" y1="50" x2="18" y2="50" />
          <line x1="82" y1="50" x2="92" y2="50" />
          <line x1="20" y1="20" x2="28" y2="28" />
          <line x1="72" y1="72" x2="80" y2="80" />
          <line x1="80" y1="20" x2="72" y2="28" />
          <line x1="20" y1="80" x2="28" y2="72" />
        </g>
        <circle cx="50" cy="50" r="30" fill="url(#sunGrad)" filter="url(#sunGlow)" />
        <circle cx="42" cy="40" r="10" fill="#FFFFFF" opacity="0.35" />
      </svg>
    </div>

    <!-- 3D Vibrant Rainbow Arch (SVG) -->
    <div class="absolute top-2 left-1/2 -translate-x-1/2 w-80 md:w-[540px] opacity-75">
      <svg viewBox="0 0 500 200" class="w-full">
        <defs>
          <linearGradient id="rainbowFade" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
          </linearGradient>
        </defs>
        <path d="M 50,190 A 200,160 0 0,1 450,190" fill="none" stroke="#FF5964" stroke-width="12" stroke-linecap="round" opacity="0.85" />
        <path d="M 60,190 A 190,150 0 0,1 440,190" fill="none" stroke="#FF9F1C" stroke-width="12" stroke-linecap="round" opacity="0.85" />
        <path d="M 70,190 A 180,140 0 0,1 430,190" fill="none" stroke="#FFE74C" stroke-width="12" stroke-linecap="round" opacity="0.85" />
        <path d="M 80,190 A 170,130 0 0,1 420,190" fill="none" stroke="#2EC4B6" stroke-width="12" stroke-linecap="round" opacity="0.85" />
        <path d="M 90,190 A 160,120 0 0,1 410,190" fill="none" stroke="#3A86FF" stroke-width="12" stroke-linecap="round" opacity="0.85" />
      </svg>
    </div>

    <!-- 3D Animated Puffy Clouds -->
    <div class="absolute top-12 left-0 w-44 md:w-56 cloud-slow opacity-90">
      <svg viewBox="0 0 160 85" class="w-full drop-shadow-md">
        <defs>
          <linearGradient id="cloudGrad1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#D9EBF8" />
          </linearGradient>
        </defs>
        <path d="M25,70 a22,22 0 0,1 0,-44 a26,26 0 0,1 40,-12 a34,34 0 0,1 55,8 a24,24 0 0,1 15,48 z" fill="url(#cloudGrad1)" />
        <ellipse cx="65" cy="40" rx="30" ry="14" fill="#FFFFFF" opacity="0.5" />
      </svg>
    </div>
    <div class="absolute top-28 left-0 w-36 md:w-48 cloud-fast opacity-80" style="animation-delay: -11s;">
      <svg viewBox="0 0 160 85" class="w-full drop-shadow-md">
        <defs>
          <linearGradient id="cloudGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#C5E3F6" />
          </linearGradient>
        </defs>
        <path d="M30,72 a18,18 0 0,1 0,-36 a24,24 0 0,1 36,-10 a30,30 0 0,1 48,6 a22,22 0 0,1 18,40 z" fill="url(#cloudGrad2)" />
      </svg>
    </div>

    <!-- 3D Rolling Midground Green Hills -->
    <div class="absolute bottom-0 w-full h-44 md:h-60">
      <svg viewBox="0 0 1000 300" preserveAspectRatio="none" class="w-full h-full">
        <defs>
          <linearGradient id="hillBackGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#70E000" />
            <stop offset="100%" stop-color="#38B000" />
          </linearGradient>
          <linearGradient id="hillFrontGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#80ED99" />
            <stop offset="100%" stop-color="#2D9A00" />
          </linearGradient>
        </defs>
        <!-- Background Layer Hills -->
        <path d="M0,170 Q280,70 560,160 T1000,120 L1000,300 L0,300 Z" fill="url(#hillBackGrad)" opacity="0.85" />
        <!-- Foreground Lush Hill -->
        <path d="M0,210 Q240,140 500,200 T1000,180 L1000,300 L0,300 Z" fill="url(#hillFrontGrad)" />
      </svg>
    </div>

    <!-- Chubby 3D Round Trees, Flowers, & Wooden Toy Fence (SVG) -->
    <div class="absolute bottom-0 left-0 w-full h-36 md:h-48 pointer-events-none flex justify-between items-end px-3 md:px-12">
      <!-- Left Tree & Mushroom -->
      <div class="w-24 md:w-36 h-36 md:h-44 relative">
        <svg viewBox="0 0 100 120" class="w-full h-full drop-shadow-md">
          <defs>
            <radialGradient id="treeCrownGrad" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#A7F3D0" />
              <stop offset="50%" stop-color="#10B981" />
              <stop offset="100%" stop-color="#047857" />
            </radialGradient>
            <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#B45309" />
              <stop offset="50%" stop-color="#D97706" />
              <stop offset="100%" stop-color="#92400E" />
            </linearGradient>
          </defs>
          <!-- Trunk -->
          <rect x="42" y="70" width="16" height="42" rx="6" fill="url(#trunkGrad)" />
          <!-- 3D Round Foliage Spheres -->
          <circle cx="50" cy="50" r="32" fill="url(#treeCrownGrad)" />
          <circle cx="35" cy="56" r="22" fill="url(#treeCrownGrad)" />
          <circle cx="65" cy="56" r="22" fill="url(#treeCrownGrad)" />
          <!-- Specular Highlight -->
          <circle cx="44" cy="38" r="8" fill="#FFFFFF" opacity="0.35" />
        </svg>
      </div>

      <!-- Wooden Toy Fence -->
      <div class="hidden sm:block w-48 md:w-64 h-16 relative -mb-2 opacity-90">
        <svg viewBox="0 0 200 60" class="w-full h-full">
          <defs>
            <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFD166" />
              <stop offset="100%" stop-color="#D49A32" />
            </linearGradient>
          </defs>
          <rect x="0" y="20" width="200" height="8" rx="3" fill="url(#woodGrad)" />
          <rect x="0" y="38" width="200" height="8" rx="3" fill="url(#woodGrad)" />
          <!-- Posts -->
          <path d="M20,6 L32,6 L32,54 L20,54 Z M26,2 L32,6 L20,6 Z" fill="url(#woodGrad)" stroke="#B37D1A" stroke-width="1" />
          <path d="M70,6 L82,6 L82,54 L70,54 Z M76,2 L82,6 L70,6 Z" fill="url(#woodGrad)" stroke="#B37D1A" stroke-width="1" />
          <path d="M120,6 L132,6 L132,54 L120,54 Z M126,2 L132,6 L120,6 Z" fill="url(#woodGrad)" stroke="#B37D1A" stroke-width="1" />
          <path d="M170,6 L182,6 L182,54 L170,54 Z M176,2 L182,6 L170,6 Z" fill="url(#woodGrad)" stroke="#B37D1A" stroke-width="1" />
        </svg>
      </div>

      <!-- Right 3D Round Tree -->
      <div class="w-20 md:w-32 h-32 md:h-40 relative">
        <svg viewBox="0 0 100 120" class="w-full h-full drop-shadow-md">
          <rect x="43" y="68" width="14" height="42" rx="5" fill="#B45309" />
          <circle cx="50" cy="48" r="30" fill="#34D399" />
          <circle cx="34" cy="52" r="20" fill="#10B981" />
          <circle cx="66" cy="52" r="20" fill="#059669" />
          <circle cx="43" cy="38" r="8" fill="#FFFFFF" opacity="0.35" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Interactive Bubble Canvas Layer -->
  <canvas id="gameCanvas" class="absolute inset-0 z-10 cursor-pointer w-full h-full"></canvas>

  <!-- Animated Chibi Panda Mascot (Bottom Center-Left of Hills) -->
  <div id="mascotContainer" class="absolute bottom-3 left-4 sm:left-12 z-20 w-28 sm:w-36 md:w-44 transition-all duration-300 pointer-events-auto select-none cursor-pointer" title="Sentuh Panda! / Tap Panda!">
    <div id="mascotWrapper" class="w-full mascot-idle-breathe">
      <svg id="pandaSvg" viewBox="0 0 140 150" class="w-full h-auto drop-shadow-2xl">
        <defs>
          <!-- 3D Fur Radial Gradients -->
          <radialGradient id="pandaWhite" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="75%" stop-color="#F1F5F9" />
            <stop offset="100%" stop-color="#CBD5E1" />
          </radialGradient>
          <radialGradient id="pandaBlack" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#475569" />
            <stop offset="70%" stop-color="#1E293B" />
            <stop offset="100%" stop-color="#0F172A" />
          </radialGradient>
          <radialGradient id="pandaCheek" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FDA4AF" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#FDA4AF" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Animated Ears -->
        <g class="panda-ears-wiggle">
          <circle cx="32" cy="32" r="18" fill="url(#pandaBlack)" />
          <circle cx="32" cy="32" r="10" fill="#64748B" opacity="0.4" />
          <circle cx="108" cy="32" r="18" fill="url(#pandaBlack)" />
          <circle cx="108" cy="32" r="10" fill="#64748B" opacity="0.4" />
        </g>

        <!-- Chubby Body -->
        <ellipse cx="70" cy="115" rx="42" ry="32" fill="url(#pandaWhite)" stroke="#E2E8F0" stroke-width="2" />
        <path d="M42,95 Q70,124 98,95 Q86,134 54,134 Z" fill="url(#pandaBlack)" opacity="0.15" />

        <!-- Arms (Paws) with Continuous Animation -->
        <g id="leftArm" class="panda-arm-left">
          <ellipse cx="32" cy="104" rx="14" ry="18" fill="url(#pandaBlack)" />
          <ellipse cx="32" cy="100" rx="6" ry="8" fill="#475569" opacity="0.3" />
        </g>
        <g id="rightArm" class="panda-arm-waving">
          <ellipse cx="108" cy="104" rx="14" ry="18" fill="url(#pandaBlack)" />
          <ellipse cx="108" cy="100" rx="6" ry="8" fill="#475569" opacity="0.3" />
        </g>

        <!-- Feet -->
        <ellipse cx="46" cy="138" rx="15" ry="10" fill="url(#pandaBlack)" />
        <ellipse cx="94" cy="138" rx="15" ry="10" fill="url(#pandaBlack)" />

        <!-- Head -->
        <circle cx="70" cy="62" r="44" fill="url(#pandaWhite)" stroke="#E2E8F0" stroke-width="2" />

        <!-- Eye Patches -->
        <ellipse cx="50" cy="58" rx="13" ry="16" fill="url(#pandaBlack)" transform="rotate(-15 50 58)" />
        <ellipse cx="90" cy="58" rx="13" ry="16" fill="url(#pandaBlack)" transform="rotate(15 90 58)" />

        <!-- Animated Blinking Eyes -->
        <g class="panda-blinking">
          <circle cx="51" cy="58" r="6" fill="#FFFFFF" />
          <circle cx="53" cy="56" r="3" fill="#1E293B" />
          <circle cx="89" cy="58" r="6" fill="#FFFFFF" />
          <circle cx="87" cy="56" r="3" fill="#1E293B" />
        </g>

        <!-- Rosy Cheeks -->
        <circle cx="36" cy="74" r="10" fill="url(#pandaCheek)" />
        <circle cx="104" cy="74" r="10" fill="url(#pandaCheek)" />

        <!-- Cute Nose & Cheerful Smiling Mouth -->
        <ellipse cx="70" cy="70" rx="6" ry="4" fill="#0F172A" />
        <path d="M64,76 Q70,83 76,76" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

        <!-- Cute Red Toy Bow Tie -->
        <g transform="translate(56, 94)">
          <polygon points="0,4 0,16 14,10" fill="#EF4444" />
          <polygon points="28,4 28,16 14,10" fill="#EF4444" />
          <circle cx="14" cy="10" r="4" fill="#DC2626" />
        </g>
      </svg>
    </div>
  </div>

  <!-- Top Navigation HUD Bar (Raised to z-40, 2-tier responsive layout so language button never overflows) -->
  <header class="absolute top-0 left-0 right-0 z-40 p-2 sm:p-4 flex flex-col items-center pointer-events-none">
    <!-- Top Action Row: Menu Button on Left, Language Switch on Right -->
    <div class="w-full flex justify-between items-center pointer-events-none">
      <!-- Home / Menu Button (Only during game) -->
      <button id="hudHomeBtn" class="pointer-events-auto hidden toy-btn-yellow px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl font-bold text-xs sm:text-sm flex items-center space-x-1.5 cursor-pointer shadow-md">
        <!-- House SVG Icon -->
        <svg class="w-4 h-4 sm:w-5 sm:h-5 pointer-events-none" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3L2 12H5V20H10V14H14V20H19V12H22L12 3Z"/>
        </svg>
        <span id="txtBtnHome" class="pointer-events-none">Menu</span>
      </button>

      <!-- Bilingual Switch Segmented Pill (BM 🇲🇾 / EN 🇬🇧) (Compact & Flex-Shrink-0) -->
      <div class="pointer-events-auto ml-auto shrink-0">
        <div class="toy-card p-1 flex items-center gap-1 bg-white/95 shadow-md border-2 border-white">
          <!-- Malaysia BM Button -->
          <button id="btnLangBM" type="button" class="px-2 py-1 sm:px-2.5 sm:py-1 rounded-xl font-black text-xs flex items-center gap-1 transition-all cursor-pointer bg-blue-600 text-white shadow-xs" title="Bahasa Melayu">
            <svg class="w-4 h-3 sm:w-5 sm:h-3.5 rounded-xs shadow-xs overflow-hidden shrink-0 pointer-events-none" viewBox="0 0 28 14">
              <rect width="28" height="14" fill="#E63946"/>
              <rect y="1" width="28" height="1" fill="#FFFFFF"/>
              <rect y="3" width="28" height="1" fill="#FFFFFF"/>
              <rect y="5" width="28" height="1" fill="#FFFFFF"/>
              <rect y="7" width="28" height="1" fill="#FFFFFF"/>
              <rect y="9" width="28" height="1" fill="#FFFFFF"/>
              <rect y="11" width="28" height="1" fill="#FFFFFF"/>
              <rect y="13" width="28" height="1" fill="#FFFFFF"/>
              <rect width="14" height="8" fill="#1D3557"/>
              <circle cx="6" cy="4" r="3" fill="#FFB703"/>
              <circle cx="7" cy="4" r="2.5" fill="#1D3557"/>
              <polygon points="9,2.5 9.5,3.7 10.7,3.3 10.1,4.3 11.2,4.8 10,5.2 10.4,6.4 9.4,5.7 8.8,6.8 8.6,5.6 7.4,5.9 8.1,4.9 7.1,4.2 8.3,4" fill="#FFB703"/>
            </svg>
            <span class="pointer-events-none font-extrabold text-[11px] sm:text-xs">BM</span>

  <script>
    /* Pure Web Audio API Sound Synthesizer (No external asset files needed) */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      /* Crisp Bubble Pop Sound */
      playPop() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.05);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.08);
      }

      /* Cheerful Success Chime */
      playSuccessChime() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.07);

          gain.gain.setValueAtTime(0, now + idx * 0.07);
          gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.07 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.35);
        });
      }

      /* Gentle Wobble / Wrong Tap Boing (Soft, encouraging, NOT scary) */
      playWobble() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.linearRampToValueAtTime(220, now + 0.1);
        osc.frequency.linearRampToValueAtTime(310, now + 0.2);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.25);
      }

      /* Victory Fanfare for Round Completion */
      playFanfare() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const melody = [
          { f: 523.25, d: 0.12, t: 0.00 }, // C5
          { f: 659.25, d: 0.12, t: 0.14 }, // E5
          { f: 783.99, d: 0.12, t: 0.28 }, // G5
          { f: 1046.50, d: 0.40, t: 0.42 }  // C6 (Triumph)
        ];

        melody.forEach(item => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(item.f, now + item.t);

          gain.gain.setValueAtTime(0.3, now + item.t);
          gain.gain.exponentialRampToValueAtTime(0.001, now + item.t + item.d);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now + item.t);
          osc.stop(now + item.t + item.d);
        });
      }

      /* Cheerful Panda Giggle / Wave Sound */
      playPandaGiggle() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [587.33, 739.99, 880.0, 1174.66].forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + idx * 0.06);
          gain.gain.setValueAtTime(0.2, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.12);
        });
      }
    }

        hudTargetLabel.textContent = text.targetLabelSeq;
      } else {
        document.getElementById('txtHowToPlayHint').textContent = text.hintCount;
        hudTargetLabel.textContent = text.targetLabelCount;
      }

      // Update visual segmented active/inactive states
      if (btnLangBM && btnLangEN) {
        if (currentLang === 'bm') {
          btnLangBM.className = "px-2 py-1 sm:px-2.5 sm:py-1 rounded-xl font-black text-xs flex items-center gap-1 transition-all cursor-pointer bg-blue-600 text-white shadow-xs";
          btnLangEN.className = "px-2 py-1 sm:px-2.5 sm:py-1 rounded-xl font-black text-xs flex items-center gap-1 transition-all cursor-pointer opacity-50 hover:opacity-90 text-slate-700";
        } else {
          btnLangEN.className = "px-2 py-1 sm:px-2.5 sm:py-1 rounded-xl font-black text-xs flex items-center gap-1 transition-all cursor-pointer bg-blue-600 text-white shadow-xs";
          btnLangBM.className = "px-2 py-1 sm:px-2.5 sm:py-1 rounded-xl font-black text-xs flex items-center gap-1 transition-all cursor-pointer opacity-50 hover:opacity-90 text-slate-700";
        }
      }
    }

    function switchLanguage(lang) {
      if (currentLang === lang) return;
      try {
        sound.playPop();
      } catch (e) {
        // Safe fallback if audio context is pending user activation
      }
      currentLang = lang;
      applyLocalization();
    }

    if (btnLangBM) {
      btnLangBM.addEventListener('click', (e) => {
        e.stopPropagation();
        switchLanguage('bm');
      });
    }

    if (btnLangEN) {
      btnLangEN.addEventListener('click', (e) => {
        e.stopPropagation();
        switchLanguage('en');
      });
    }

    btnModeSeq.addEventListener('click', () => {
      sound.playPop();
      currentMode = 'seq';
      btnModeSeq.className = "toy-card px-3 py-3 border-2 border-amber-400 bg-amber-50 rounded-2xl flex flex-col items-center transition-all";
      btnModeCount.className = "toy-card px-3 py-3 border-2 border-transparent bg-white rounded-2xl flex flex-col items-center opacity-70 hover:opacity-100 transition-all";
      applyLocalization();
    });

    btnModeCount.addEventListener('click', () => {
      sound.playPop();
      currentMode = 'count';
      btnModeCount.className = "toy-card px-3 py-3 border-2 border-sky-400 bg-sky-50 rounded-2xl flex flex-col items-center transition-all";
      btnModeSeq.className = "toy-card px-3 py-3 border-2 border-transparent bg-white rounded-2xl flex flex-col items-center opacity-70 hover:opacity-100 transition-all";
      applyLocalization();
    });

    btnTier1.addEventListener('click', () => {
      sound.playPop();
      currentTier = 1;
      btnTier1.className = "toy-card px-3 py-2.5 border-2 border-emerald-500 bg-emerald-50 rounded-2xl text-left transition-all";
      btnTier2.className = "toy-card px-3 py-2.5 border-2 border-transparent bg-white rounded-2xl text-left opacity-70 hover:opacity-100 transition-all";
    });

    btnTier2.addEventListener('click', () => {
      sound.playPop();
      currentTier = 2;
      btnTier2.className = "toy-card px-3 py-2.5 border-2 border-indigo-500 bg-indigo-50 rounded-2xl text-left transition-all";
      btnTier1.className = "toy-card px-3 py-2.5 border-2 border-transparent bg-white rounded-2xl text-left opacity-70 hover:opacity-100 transition-all";
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerMascotCheer() {
      mascotWrapper.classList.remove('mascot-cheering');
      mascotWrapper.classList.remove('mascot-idle-breathe');
      void mascotWrapper.offsetWidth; // Trigger reflow
      mascotWrapper.classList.add('mascot-cheering');
      setTimeout(() => {
        mascotWrapper.classList.remove('mascot-cheering');
        mascotWrapper.classList.add('mascot-idle-breathe');
      }, 900);
    }

    // Tap/Click on Panda to make him react and cheer!
    mascotContainer.addEventListener('click', () => {
      sound.playPandaGiggle();
      triggerMascotCheer();
    });

    function setHudTargetNumber(num) {
      hudTargetValue.textContent = num;
      hudTargetValue.classList.remove('target-highlight-anim');
      void hudTargetValue.offsetWidth;
      hudTargetValue.classList.add('target-highlight-anim');
    }

    function updateRoundBadges() {
      hudRoundBadges.innerHTML = '';
      for (let i = 1; i <= TOTAL_ROUNDS; i++) {
        const dot = document.createElement('div');
        if (i < currentRound) {
          dot.className = "w-3 h-3 rounded-full bg-emerald-500 border border-white shadow-sm";
        } else if (i === currentRound) {
          dot.className = "w-4 h-4 rounded-full bg-amber-400 border-2 border-white shadow-md animate-pulse";
        } else {
          dot.className = "w-3 h-3 rounded-full bg-slate-300 border border-white";
        }
        hudRoundBadges.appendChild(dot);
      }
    }

    class ToyBubble {
      constructor(val, x, y, radius, isMarbleMode = false) {
        this.val = val;
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.baseRadius = radius;
        this.isMarbleMode = isMarbleMode;

        // Gentle floating physics
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = -(0.5 + Math.random() * 0.8);
        this.wobblePhase = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.03 + Math.random() * 0.02;

        // Error wobble effect
        this.wobbleIntensity = 0;

        // Rich Toy Bubble Color Palette (Gradients)
        const palettes = [
          { main: '#FF5964', rim: '#D90429', highlight: '#FFE5EC' }, // Coral
          { main: '#3A86FF', rim: '#0053D6', highlight: '#E0EEFF' }, // Blue
          { main: '#FF9F1C', rim: '#D47500', highlight: '#FFF4E5' }, // Orange
          { main: '#06D6A0', rim: '#029E75', highlight: '#E5FCF7' }, // Emerald
          { main: '#9B5DE5', rim: '#6B21A8', highlight: '#F4ECFF' }  // Purple
        ];
        this.palette = palettes[val % palettes.length];

        // Generate coordinates for marbles inside if marble mode
        this.marbles = [];
        if (this.isMarbleMode) {
          const marbleRadius = Math.max(7, this.radius / (val > 5 ? 4.5 : 3.8));
          for (let i = 0; i < val; i++) {
            const angle = (i / val) * Math.PI * 2 + Math.random() * 0.2;
            const dist = val === 1 ? 0 : (Math.random() * 0.35 + 0.25) * (this.radius - marbleRadius - 6);
            this.marbles.push({
              ox: Math.cos(angle) * dist,
              oy: Math.sin(angle) * dist,
              r: marbleRadius,
              color: palettes[(i + 1) % palettes.length].main
            });
          }
        }
      }

      update() {
        this.wobblePhase += this.wobbleSpeed;
        this.x += this.vx + Math.sin(this.wobblePhase) * 0.4;
        this.y += this.vy;

        // Screen boundary bounce
        if (this.x - this.radius < 10) {
          this.x = 10 + this.radius;
          this.vx *= -1;
        } else if (this.x + this.radius > canvas.width - 10) {
          this.x = canvas.width - 10 - this.radius;
          this.vx *= -1;
        }

        // Float up and recycle smoothly at bottom if offscreen top
        if (this.y + this.radius < -20) {
          this.y = canvas.height + this.radius + Math.random() * 40;
          this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
        }

        // Damping error wobble
        if (this.wobbleIntensity > 0) {
          this.wobbleIntensity -= 0.05;
          if (this.wobbleIntensity < 0) this.wobbleIntensity = 0;
        }
      }

      triggerError() {
        this.wobbleIntensity = 1.0;
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);

        // Calculate wobble perturbation
        const wX = 1 + (this.wobbleIntensity > 0 ? Math.sin(this.wobblePhase * 6) * 0.18 * this.wobbleIntensity : 0);
        const wY = 1 - (this.wobbleIntensity > 0 ? Math.sin(this.wobblePhase * 6) * 0.18 * this.wobbleIntensity : 0);
        c.scale(wX, wY);

        // 1. Soft Drop Shadow
        c.beginPath();
        c.arc(0, this.radius * 0.15, this.radius * 0.95, 0, Math.PI * 2);
        c.fillStyle = "rgba(13, 71, 161, 0.18)";
        c.fill();

        // 2. 3D Spherical Sphere Body Gradient
        const sphereGrad = c.createRadialGradient(
          -this.radius * 0.35, -this.radius * 0.35, this.radius * 0.1,
          0, 0, this.radius
        );
        sphereGrad.addColorStop(0, '#FFFFFF');
        sphereGrad.addColorStop(0.3, this.palette.highlight);
        sphereGrad.addColorStop(0.7, this.palette.main);
        sphereGrad.addColorStop(1, this.palette.rim);

        c.beginPath();
        c.arc(0, 0, this.radius, 0, Math.PI * 2);
        c.fillStyle = sphereGrad;
        c.fill();

        // 3. 3D Outer Glass Rim Glow (Turns reddish soft alert during wrong tap wobble)
        c.lineWidth = 4;
        c.strokeStyle = this.wobbleIntensity > 0 
          ? `rgba(239, 68, 68, ${Math.min(1, this.wobbleIntensity)})` 
          : "rgba(255, 255, 255, 0.75)";
        c.stroke();

        // 4. Primary Specular Highlight (Soft glossy pill shape)
        c.save();
        c.rotate(-Math.PI / 4);
        c.beginPath();
        c.ellipse(0, -this.radius * 0.62, this.radius * 0.45, this.radius * 0.2, 0, 0, Math.PI * 2);
        c.fillStyle = "rgba(255, 255, 255, 0.85)";
        c.fill();
        c.restore();

        // Secondary rim reflection at bottom
        c.beginPath();
        c.arc(0, this.radius * 0.6, this.radius * 0.28, 0, Math.PI * 2);
        c.fillStyle = "rgba(255, 255, 255, 0.35)";
        c.fill();

        // 5. Bubble Content (Large 3D Number Badge OR Marbles)
        if (this.isMarbleMode) {
          // Render Marbles Inside
          this.marbles.forEach(m => {
            const mg = c.createRadialGradient(
              m.ox - m.r * 0.3, m.oy - m.r * 0.3, m.r * 0.1,
              m.ox, m.oy, m.r
            );
            mg.addColorStop(0, '#FFFFFF');
            mg.addColorStop(0.4, m.color);
            mg.addColorStop(1, '#0F172A');

            c.beginPath();
            c.arc(m.ox, m.oy, m.r, 0, Math.PI * 2);
            c.fillStyle = mg;
            c.fill();
            c.lineWidth = 1.5;
            c.strokeStyle = '#FFFFFF';
            c.stroke();
          });
        } else {
          // Render High Contrast 3D Number Text
          c.font = `800 ${Math.floor(this.radius * 0.95)}px 'Quicksand', sans-serif`;
          c.textAlign = 'center';
          c.textBaseline = 'middle';

          // Text Soft Shadow
          c.fillStyle = 'rgba(0, 0, 0, 0.2)';
          c.fillText(this.val, 0, 4);

          // White Badge Text with Outline
          c.fillStyle = '#FFFFFF';
          c.fillText(this.val, 0, 0);

          c.lineWidth = 3;
          c.strokeStyle = this.palette.rim;
          c.strokeText(this.val, 0, 0);
        }

        c.restore();
      }

      contains(px, py) {
        const dx = px - this.x;
        const dy = py - this.y;
        return (dx * dx + dy * dy) <= (this.radius * this.radius * 1.1);
      }
    }

    /* Bubble Pop Burst Particle */
    class PopParticle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 7;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.radius = 4 + Math.random() * 6;
        this.alpha = 1;
        this.decay = 0.025 + Math.random() * 0.02;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15; // Gravity
        this.alpha -= this.decay;
      }
      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.alpha);
        c.beginPath();
        c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        c.fillStyle = this.color;
        c.fill();
        c.restore();
      }
    }

    /* Celebration Confetti */
    class Confetti {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = -Math.random() * 12 - 4;
        this.gravity = 0.25;
        this.rotation = Math.random() * 360;
        this.vRot = (Math.random() - 0.5) * 12;
        this.size = 8 + Math.random() * 8;
        const colors = ['#FF5964', '#FF9F1C', '#FFE74C', '#2EC4B6', '#3A86FF', '#A7F3D0'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.alpha = 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rotation += this.vRot;
        if (this.y > canvas.height + 20) {
          this.alpha = 0;
        }
      }
      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate((this.rotation * Math.PI) / 180);
        c.fillStyle = this.color;
        c.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
        c.restore();
      }
    }

    function createPopBurst(x, y, color) {
      for (let i = 0; i < 22; i++) {
        particles.push(new PopParticle(x, y, color));
      }
    }

    function spawnVictoryConfetti() {
      for (let i = 0; i < 100; i++) {
        confettiList.push(new Confetti(canvas.width / 2 + (Math.random() - 0.5) * 200, canvas.height * 0.4));
      }
    }

    function setupRound() {
      bubbles = [];
      const maxVal = currentTier === 1 ? 5 : 10;
      updateRoundBadges();

      const bubbleRadius = Math.min(canvas.width, canvas.height) < 600 ? 38 : 50;

      if (currentMode === 'seq') {
        // RANDOM NUMBER TARGET MODE (Non-sequential!)
        // Create an array of distinct numbers for this round
        const nums = [];
        for (let i = 1; i <= maxVal; i++) nums.push(i);

        // Shuffle the sequence so targets come in completely random order
        remainingTargets = [...nums].sort(() => Math.random() - 0.5);
        currentTargetNumber = remainingTargets.pop();
        setHudTargetNumber(currentTargetNumber);

        // Distribute nicely along horizontal bands
        const cols = nums.length;
        const colWidth = (canvas.width - bubbleRadius * 3) / cols;

        nums.forEach((val, idx) => {
          const startX = bubbleRadius * 1.5 + idx * colWidth + (Math.random() - 0.5) * (colWidth * 0.4);
          const startY = canvas.height - 120 - Math.random() * (canvas.height * 0.45);
          bubbles.push(new ToyBubble(val, startX, startY, bubbleRadius, false));
        });

      } else {
        // Marble Count Match Mode:
        // Pick a target count
        currentCountTarget = Math.floor(Math.random() * maxVal) + 1;
        setHudTargetNumber(currentCountTarget);

        // Generate choices: 1 correct + 2-3 random distinct options
        const choiceCounts = [currentCountTarget];
        while (choiceCounts.length < (currentTier === 1 ? 3 : 4)) {
          const r = Math.floor(Math.random() * maxVal) + 1;
          if (!choiceCounts.includes(r)) choiceCounts.push(r);
        }
        // Shuffle choices
        choiceCounts.sort(() => Math.random() - 0.5);

        const cols = choiceCounts.length;
        const colWidth = (canvas.width - bubbleRadius * 3.5) / cols;

        choiceCounts.forEach((val, idx) => {
          const startX = bubbleRadius * 1.8 + idx * colWidth + (Math.random() - 0.5) * (colWidth * 0.3);
          const startY = canvas.height - 140 - Math.random() * (canvas.height * 0.4);
          bubbles.push(new ToyBubble(val, startX, startY, bubbleRadius + 4, true));
        });
      }
    }

    function handlePointerInteraction(clientX, clientY) {
      if (!isPlaying || isTransitioning) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (b.contains(clickX, clickY)) {
          // Check correctness
          if (currentMode === 'seq') {
            // Must match the randomly requested target number
            if (b.val === currentTargetNumber) {
              sound.playPop();
              createPopBurst(b.x, b.y, b.palette.main);
              bubbles.splice(i, 1);

              score += 100;
              hudScoreValue.textContent = score;
              triggerMascotCheer();

              if (remainingTargets.length === 0) {
                // Completed all random numbers in this round!
                advanceRound(true);
              } else {
                // Select next random target from remaining unpopped bubbles
                currentTargetNumber = remainingTargets.pop();
                setHudTargetNumber(currentTargetNumber);
              }
            } else {
              // Incorrect Bubble: Soft wobble tone, red glow & immediately advance to next round!
              sound.playWobble();
              b.triggerError();
              isTransitioning = true;
              setTimeout(() => {
                advanceRound(false);
              }, 450);
            }
          } else {
            // Count Match Mode
            if (b.val === currentCountTarget) {
              sound.playSuccessChime();
              createPopBurst(b.x, b.y, b.palette.main);
              bubbles.splice(i, 1);

              score += 100;
              hudScoreValue.textContent = score;
              triggerMascotCheer();
              advanceRound(true);
            } else {
              // Incorrect Bubble: Soft wobble tone, red glow & immediately advance to next round!
              sound.playWobble();
              b.triggerError();
              isTransitioning = true;
              setTimeout(() => {
                advanceRound(false);
              }, 450);
            }
          }
          break; // Process one bubble tap at a time
        }
      }
    }

    // Pointer Events for both Mouse & Touch support
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handlePointerInteraction(e.clientX, e.clientY);
    });

    function advanceRound(wasCorrect = true) {
      if (currentRound < TOTAL_ROUNDS) {
        currentRound++;
        if (wasCorrect) {
          sound.playSuccessChime();
        }
        setTimeout(() => {
          setupRound();
          isTransitioning = false;
        }, wasCorrect ? 600 : 400);
      } else {
        // Game Completed!
        isPlaying = false;
        isTransitioning = false;
        sound.playFanfare();
        spawnVictoryConfetti();

        if (score > highScore) {
          highScore = score;
          highScoreDisplay.textContent = highScore;
        }

        document.getElementById('victoryFinalScore').textContent = score;
        setTimeout(() => {
          victoryModal.classList.remove('hidden');
        }, 700);
      }
    }

    function startGame() {
      sound.playPop();
      score = 0;
      currentRound = 1;
      isTransitioning = false;
      hudScoreValue.textContent = score;

      frontPage.classList.add('hidden');
      hudHomeBtn.classList.remove('hidden');
      gameHudCenter.classList.remove('hidden');
      victoryModal.classList.add('hidden');

      isPlaying = true;
      setupRound();
      applyLocalization();
    }

    function returnToMainMenu() {
      sound.playPop();
      isPlaying = false;
      isTransitioning = false;
      bubbles = [];
      particles = [];
      confettiList = [];

      victoryModal.classList.add('hidden');
      hudHomeBtn.classList.add('hidden');
      gameHudCenter.classList.add('hidden');
      frontPage.classList.remove('hidden');
      highScoreDisplay.textContent = highScore;
    }

    btnStartGame.addEventListener('click', startGame);
    hudHomeBtn.addEventListener('click', returnToMainMenu);
    btnVictoryHome.addEventListener('click', returnToMainMenu);
    btnPlayAgain.addEventListener('click', () => {
      startGame();
    });

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Floating Bubbles
      if (isPlaying) {
        bubbles.forEach(b => {
          b.update();
          b.draw(ctx);
        });
      }

      // Render Burst Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      // Render Victory Confetti
      for (let i = confettiList.length - 1; i >= 0; i--) {
        const c = confettiList[i];
        c.update();
        c.draw(ctx);
        if (c.alpha <= 0) confettiList.splice(i, 1);
      }

      requestAnimationFrame(gameLoop);
    }

    // Launch loop on window load
    window.onload = function() {
      applyLocalization();
      gameLoop();
    };
  </script>
